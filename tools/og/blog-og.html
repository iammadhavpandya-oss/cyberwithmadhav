<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../assets/css/fonts.css">
<style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;overflow:hidden;background:#0D0B14;color:#F4F1FA;font-family:Inter,sans-serif;position:relative}
.glow1{position:absolute;width:760px;height:760px;left:-220px;top:-300px;border-radius:50%;background:radial-gradient(circle,rgba(139,92,246,.55),transparent 65%)}
.glow2{position:absolute;width:700px;height:700px;right:-240px;bottom:-330px;border-radius:50%;background:radial-gradient(circle,rgba(34,197,94,.38),transparent 65%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(183,156,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(183,156,255,.07) 1px,transparent 1px);background-size:48px 48px}
.card{position:absolute;inset:56px 64px;border-radius:32px;border:1.5px solid rgba(183,156,255,.35);background:linear-gradient(140deg,rgba(30,24,41,.78),rgba(22,18,31,.55));padding:52px 60px;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:16px;font:700 32px 'Space Grotesk';letter-spacing:-.02em}
.brand b{color:#B79CFF}.brand img{width:50px;height:50px}
.cat{margin-left:auto;font:500 20px 'JetBrains Mono';color:#4ADE80;text-transform:uppercase;letter-spacing:.08em}
h1{margin-top:44px;font:700 62px/1.08 'Space Grotesk';letter-spacing:-.025em;max-width:980px}
.row{margin-top:auto;display:flex;gap:14px;align-items:center}
.chip{white-space:nowrap;font:500 21px 'JetBrains Mono';padding:9px 18px;border-radius:999px;border:1.5px solid rgba(183,156,255,.45);color:#E6DEFF;background:rgba(139,92,246,.16)}
.chip.g{border-color:rgba(74,222,128,.55);color:#BBF7D0;background:rgba(34,197,94,.14)}
.by{margin-left:auto;font:500 21px Inter;color:#CFC6E6}
</style></head><body>
<div class="glow1"></div><div class="glow2"></div><div class="grid"></div>
<div class="card">
  <div class="brand"><img src="../../favicon.svg" alt=""><span>Cyber<b>With</b>Madhav</span><span class="cat" id="c"></span></div>
  <h1 id="t"></h1>
  <div class="row"><span class="chip g">Call 1930</span><span class="chip">cybercrime.gov.in</span><span class="by">Blog · by Madhav Pandya</span></div>
</div>
<script>var q=new URLSearchParams(location.search);document.getElementById('t').textContent=q.get('t')||'';document.getElementById('c').textContent=q.get('c')||'';</script>
</body></html>
